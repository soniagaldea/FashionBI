<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
    <defs>
        <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%"   stop-color="#5b5fc7"/>
            <stop offset="100%" stop-color="#7c74e0"/>
        </linearGradient>
    </defs>
    <!-- Rounded-square background matching the indigo .brand-icon container -->
    <rect width="24" height="24" rx="6.5" fill="url(#bg)"/>
    <!-- Price tag outline -->
    <path d="M14 4.5 L19 4.5 A2.5 2.5 0 0 1 21.5 7 L21.5 18
             A2.5 2.5 0 0 1 19 20.5 L5 20.5
             A2.5 2.5 0 0 1 2.5 18 L2.5 7
             A2.5 2.5 0 0 1 5 4.5 L10 4.5"
          stroke="white" stroke-width="1.4"
          stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- Hole ring -->
    <circle cx="12" cy="4.5" r="2" stroke="white" stroke-width="1.4" fill="none"/>
    <!-- 3 ascending analytics bars -->
    <rect x="6"    y="16" width="3" height="3" fill="white" rx="0.5"/>
    <rect x="10.5" y="13" width="3" height="6" fill="white" rx="0.5"/>
    <rect x="15"   y="10" width="3" height="9" fill="white" rx="0.5"/>
</svg>
